name: Scientific validation

on:
  push:
    paths:
      - "src/**"
      - "examples/**"
      - "pyproject.toml"
      - ".github/workflows/scientific-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python examples/scientific_validation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-validation
          path: artifacts/validation/
          if-no-files-found: error
