<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Wavelet Trend Clustering overview</title>
  <desc id="description">A noisy time series is compressed into low-frequency wavelet coefficients and separated into increasing, stable, and seasonal trend clusters.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.52" stop-color="#172554"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#c7d2fe" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1110" cy="24" r="180" fill="#7c3aed" opacity="0.14"/>
  <circle cx="60" cy="340" r="170" fill="#0891b2" opacity="0.12"/>

  <g transform="translate(64 58)">
    <text x="0" y="0" fill="#e0e7ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="500" letter-spacing="2.2">INTERPRETABLE TIME-SERIES CLUSTERING</text>
    <text x="0" y="62" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="700">Wavelet Trend Clustering</text>
    <text x="0" y="104" fill="#c7d2fe" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">Low-frequency DWT features · k-means++ · reconstructed trends</text>
  </g>

  <g transform="translate(66 220)">
    <text x="0" y="-22" fill="#a5b4fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">NOISY SIGNAL</text>
    <path d="M0 42 L12 24 L24 55 L36 18 L48 44 L60 28 L72 61 L84 32 L96 45 L108 20 L120 47 L132 36 L144 54 L156 30 L168 41 L180 22 L192 50 L204 31 L216 43 L228 17 L240 39" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <path d="M0 46 C38 44 65 41 96 38 S160 28 240 20" fill="none" stroke="url(#wave)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  </g>

  <g transform="translate(354 221)">
    <path d="M0 35 H58" stroke="#c7d2fe" stroke-width="2" stroke-dasharray="5 7" opacity="0.6"/>
    <path d="M47 24 L58 35 L47 46" fill="none" stroke="#c7d2fe" stroke-width="2"/>
  </g>

  <g transform="translate(440 205)">
    <text x="0" y="-7" fill="#a5b4fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">COARSE COEFFICIENTS</text>
    <rect x="0" y="12" width="66" height="58" rx="10" fill="#0e7490" opacity="0.92"/>
    <rect x="76" y="12" width="66" height="58" rx="10" fill="#6366f1" opacity="0.92"/>
    <rect x="152" y="12" width="66" height="58" rx="10" fill="#7c3aed" opacity="0.92"/>
    <g fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">
      <text x="33" y="49">c₀</text><text x="109" y="49">d₀</text><text x="185" y="49">d₁</text>
    </g>
  </g>

  <g transform="translate(685 221)">
    <path d="M0 35 H58" stroke="#c7d2fe" stroke-width="2" stroke-dasharray="5 7" opacity="0.6"/>
    <path d="M47 24 L58 35 L47 46" fill="none" stroke="#c7d2fe" stroke-width="2"/>
  </g>

  <g transform="translate(775 185)">
    <text x="0" y="13" fill="#a5b4fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">TREND CLUSTERS</text>
    <g transform="translate(0 29)">
      <rect width="100" height="82" rx="13" fill="#ffffff" opacity="0.08"/>
      <path d="M15 62 C36 60 54 47 84 18" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
      <text x="50" y="101" text-anchor="middle" fill="#e0e7ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">INCREASING</text>
    </g>
    <g transform="translate(120 29)">
      <rect width="100" height="82" rx="13" fill="#ffffff" opacity="0.08"/>
      <path d="M15 42 C35 38 58 44 84 40" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
      <text x="50" y="101" text-anchor="middle" fill="#e0e7ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">STABLE</text>
    </g>
    <g transform="translate(240 29)">
      <rect width="100" height="82" rx="13" fill="#ffffff" opacity="0.08"/>
      <path d="M15 44 C29 10 48 10 61 44 S82 76 87 41" fill="none" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
      <text x="50" y="101" text-anchor="middle" fill="#e0e7ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">SEASONAL</text>
    </g>
  </g>
</svg>
