[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wavelet-trend-clustering"
version = "0.1.0"
description = "Interpretable clustering of time-series trends with low-frequency wavelet coefficients."
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
authors = [{name = "Wavelet Trend Clustering contributors"}]
keywords = ["time-series", "wavelets", "clustering", "k-means", "scikit-learn"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.23",
  "PyWavelets>=1.4",
  "scikit-learn>=1.2",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.6", "pandas>=1.5"]
dev = [
  "build>=1.0",
  "matplotlib>=3.6",
  "pandas>=1.5",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.4",
]

[project.urls]
Paper = "https://arxiv.org/abs/2011.12111"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
